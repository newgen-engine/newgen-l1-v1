[package]
name = "newgen_engine"
version = "1.0.0"
edition = "2021"
rust-version = "1.90"

# ============================================================
# Binary target (main node)
# ============================================================
[[bin]]
name = "newgen_engine"
path = "src/main.rs"

# ============================================================
# Library target (API + shared types)
# ============================================================
[lib]
name = "newgen_engine"
path = "src/lib.rs"

# ============================================================
# Dependencies
# ============================================================
[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
rand = "0.8"
rand_core = "0.6"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
config = "0.13"
toml = "0.7"
bincode = "1.3"
fjall = "3.1.0"
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = "1.8"
native-tls = "0.2"

libp2p = { version = "=0.53.0", default-features = false, features = [
  "gossipsub",
  "request-response",
  "noise",
  "yamux",
  "dns",
  "tcp",
  "identify",
  "ping",
  "autonat",
  "relay",
  "dcutr",
  "macros",
  "tokio"
] }

lazy_static = "1"
once_cell = "1"
chrono = "0.4"

warp = { version = "0.3", default-features = false, features = ["tls"] }

aes-gcm = "0.10"

local-ip-address = "0.5"

clap = { version = "4.5", features = ["derive"] }

[features]
# Default: compat OFF. Si abilita solo esplicitamente in build.
devnet-compat-network-id = []
devnet-permissive-miners = []
devnet-config-fallback = []
test-faults = []

[dev-dependencies]
proptest = "1"
tempfile = "3"
